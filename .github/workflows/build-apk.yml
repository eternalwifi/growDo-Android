name: Build growDo APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Extract and Build
        run: |
          unzip -o growDo_Android_Project.zip -d ext
          cd ext/growDo_Android_Project
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: growDo-APK
          path: ext/**/build/outputs/apk/debug/*.apk
          
